name: Cloudflare deploy

# Builds and uploads the Cloudflare Workers version of the site.
#
#   preview    -> Worker "orinks-net-preview" (workers.dev, not indexed).
#                 Never touches Convex.
#   production -> deploys the Convex functions to production, builds the
#                 Worker inside `convex deploy --cmd ...`, then uploads the
#                 Worker "orinks-net". Same contract as vercel.json's main
#                 build (scripts/vercel-build.mjs).
#
# Every push to dev deploys the preview Worker (no Convex), like a Vercel
# preview. A game release's "hearken-rules" dispatch redeploys production
# with that release's rules module. Every push to main deploys production: orinks.net is served by the
# "orinks-net" Worker, and this is the only pipeline that deploys the Convex
# backend (Vercel's Git integration is disconnected). The preview Worker is
# also deployable by hand with "Run workflow". See CLOUDFLARE.md.
#
# Repository secrets: CLOUDFLARE_API_TOKEN, CONVEX_DEPLOY_KEY (production
# deploy key).
# Repository variables: CLOUDFLARE_ACCOUNT_ID, NEXT_PUBLIC_CONVEX_URL (preview
# builds only; production gets it from convex deploy),
# NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY, NEXT_PUBLIC_TURNSTILE_SITE_KEY,
# NEXT_PUBLIC_VAPID_PUBLIC_KEY.

on:
  push:
    branches:
      - main
      - dev
  # A Hearken game's release asks for this (wickets' release.yml) once its
  # rules module is attached, so the live site starts accepting that
  # release's runs. It runs on main: a production deploy.
  repository_dispatch:
    types: [hearken-rules]
  workflow_dispatch:
    inputs:
      target:
        description: Which Worker to deploy
        type: choice
        options:
          - preview
          - production
        default: preview

concurrency:
  group: cloudflare-deploy-${{ (inputs.target || (github.ref == 'refs/heads/dev' && 'preview' || 'production')) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ (inputs.target || (github.ref == 'refs/heads/dev' && 'preview' || 'production')) }}
    runs-on: ubuntu-latest
    # Production only from main.
    if: (inputs.target || (github.ref == 'refs/heads/dev' && 'preview' || 'production')) == 'preview' || github.ref == 'refs/heads/main'
    env:
      # Pushes have no inputs: dev deploys the preview, main production.
      TARGET: ${{ (inputs.target || (github.ref == 'refs/heads/dev' && 'preview' || 'production')) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every listed game's rules modules, from its releases
      # (hearken-rules/sources.json), bundled into the Worker by the build.
      - name: Fetch Hearken rules modules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-hearken-rules.mjs

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CONVEX_DEPLOY_KEY: ${{ (inputs.target || (github.ref == 'refs/heads/dev' && 'preview' || 'production')) == 'production' && secrets.CONVEX_DEPLOY_KEY || '' }}
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: node scripts/cloudflare-build.mjs --target "$TARGET"
