name: Cloudflare deploy

# Builds and uploads the Cloudflare Workers version of the site.
#
#   preview    -> Worker "orinks-net-preview" (workers.dev, not indexed).
#                 Never touches Convex.
#   production -> deploys the Convex functions to production, builds the
#                 Worker inside `convex deploy --cmd ...`, then uploads the
#                 Worker "orinks-net". Same contract as vercel.json's main
#                 build (scripts/vercel-build.mjs).
#
# Manual only for now. While Vercel still serves orinks.net, its main build
# already deploys Convex; at cutover add a `push: branches: [main]` trigger
# (and remove the Vercel Git integration) so exactly one place deploys the
# backend. See CLOUDFLARE.md.
#
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# CONVEX_DEPLOY_KEY (production deploy key).
# Repository variables: NEXT_PUBLIC_CONVEX_URL (preview builds only; production
# gets it from convex deploy), NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY,
# NEXT_PUBLIC_TURNSTILE_SITE_KEY, NEXT_PUBLIC_VAPID_PUBLIC_KEY.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which Worker to deploy
        type: choice
        options:
          - preview
          - production
        default: preview

concurrency:
  group: cloudflare-deploy-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.target }}
    runs-on: ubuntu-latest
    # Production only from main.
    if: inputs.target == 'preview' || github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONVEX_DEPLOY_KEY: ${{ inputs.target == 'production' && secrets.CONVEX_DEPLOY_KEY || '' }}
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: node scripts/cloudflare-build.mjs --target ${{ inputs.target }}
