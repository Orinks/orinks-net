name: Cloudflare deploy

# Builds and uploads the Cloudflare Workers version of the site.
#
#   preview    -> Worker "orinks-net-preview" (workers.dev, not indexed).
#                 Never touches Convex.
#   production -> deploys the Convex functions to production, builds the
#                 Worker inside `convex deploy --cmd ...`, then uploads the
#                 Worker "orinks-net". Same contract as vercel.json's main
#                 build (scripts/vercel-build.mjs).
#
# Every push to dev deploys the preview Worker (no Convex), like a Vercel
# preview. A game release's "hearken-rules" dispatch redeploys production
# with that release's rules module. Every push to main deploys production: orinks.net is served by the
# "orinks-net" Worker, and this is the only pipeline that deploys the Convex
# backend (Vercel's Git integration is disconnected). The preview Worker is
# also deployable by hand with "Run workflow". See CLOUDFLARE.md.
#
# Repository secrets: CLOUDFLARE_API_TOKEN, CONVEX_DEPLOY_KEY (production
# deploy key).
# Repository variables: CLOUDFLARE_ACCOUNT_ID, NEXT_PUBLIC_CONVEX_URL (preview
# builds only; production gets it from convex deploy),
# NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY, NEXT_PUBLIC_TURNSTILE_SITE_KEY,
# NEXT_PUBLIC_VAPID_PUBLIC_KEY.

on:
  push:
    branches:
      - main
      - dev
  # A Hearken game's release asks for this (wickets' release.yml) once its
  # rules module is attached, so the live site starts accepting that
  # release's runs. It runs on main: a production deploy.
  repository_dispatch:
    types: [hearken-rules]
  workflow_dispatch:
    inputs:
      target:
        description: Which Worker to deploy (or games-secrets, to set the games' secrets and deploy nothing)
        type: choice
        options:
          - preview
          - production
          - games-secrets
        default: preview

concurrency:
  group: cloudflare-deploy-${{ (inputs.target || (github.ref == 'refs/heads/dev' && 'preview' || 'production')) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ (inputs.target || (github.ref == 'refs/heads/dev' && 'preview' || 'production')) }}
    runs-on: ubuntu-latest
    # Production only from main.
    if: inputs.target != 'games-secrets' && ((inputs.target || (github.ref == 'refs/heads/dev' && 'preview' || 'production')) == 'preview' || github.ref == 'refs/heads/main')
    env:
      # Pushes have no inputs: dev deploys the preview, main production.
      TARGET: ${{ (inputs.target || (github.ref == 'refs/heads/dev' && 'preview' || 'production')) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every listed game's rules modules, from its releases
      # (hearken-rules/sources.json), bundled into the Worker by the build.
      - name: Fetch Hearken rules modules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-hearken-rules.mjs

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CONVEX_DEPLOY_KEY: ${{ (inputs.target || (github.ref == 'refs/heads/dev' && 'preview' || 'production')) == 'production' && secrets.CONVEX_DEPLOY_KEY || '' }}
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: node scripts/cloudflare-build.mjs --target "$TARGET"

  # Sets the Hearken games' secrets on production, so nobody has to make or
  # copy them: GAMES_SERVER_SECRET on the Convex deployment and the same
  # value on the "orinks-net" Worker, and WICKETS_SEED_SECRET on the Worker.
  # Values are made here, never printed, and kept if already set: changing
  # the seed secret mid-week would change that week's boards. Run it by hand
  # with target "games-secrets"; running it again changes nothing.
  games-secrets:
    name: Set the games' secrets
    runs-on: ubuntu-latest
    if: inputs.target == 'games-secrets'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set the secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          make_secret() { openssl rand -hex 32; }
          worker=orinks-net

          # The server secret: Convex's if it has one, else a new one there.
          games=$(npx convex env get GAMES_SERVER_SECRET 2>/dev/null || true)
          if [ ${#games} -lt 32 ]; then
            games=$(make_secret)
            echo "::add-mask::$games"
            npx convex env set GAMES_SERVER_SECRET "$games" > /dev/null
            echo "Made GAMES_SERVER_SECRET on Convex."
          else
            echo "::add-mask::$games"
            echo "Convex already has GAMES_SERVER_SECRET."
          fi
          # The Worker gets the same value every run, so the two always match.
          npx cf workers secrets update GAMES_SERVER_SECRET --worker "$worker" --text "$games" > /dev/null
          echo "Set GAMES_SERVER_SECRET on $worker."

          # The seed secret lives only on the Worker, and is kept once made.
          if npx cf workers secrets list --worker "$worker" | grep -q WICKETS_SEED_SECRET; then
            echo "$worker already has WICKETS_SEED_SECRET."
          else
            seed=$(make_secret)
            echo "::add-mask::$seed"
            npx cf workers secrets update WICKETS_SEED_SECRET --worker "$worker" --text "$seed" > /dev/null
            echo "Made WICKETS_SEED_SECRET on $worker."
          fi
