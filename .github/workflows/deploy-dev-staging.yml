name: Deploy temporary Freight Fate staging

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-dev-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Validate backend, then deploy dev site
    runs-on: ubuntu-latest
    environment: freight-fate-staging
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate site
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Deploy fixed staging backend, then request Vercel build
        env:
          FREIGHT_FATE_STAGING_ENABLED: "true"
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VERCEL_DEV_DEPLOY_HOOK: ${{ secrets.VERCEL_DEV_DEPLOY_HOOK }}
        run: node scripts/deploy-freight-fate-staging.mjs
